server.port=8080
spring.application.name=skillsos-backend

# Firebase Configuration
# Path to service account JSON (reads from environment GOOGLE_APPLICATION_CREDENTIALS or fallback property)
firebase.credentials-path=${GOOGLE_APPLICATION_CREDENTIALS:}
firebase.project-id=${FIREBASE_PROJECT_ID:}

# Campus XML Resources (Java Lab Syllabus DOM Requirement)
skillsos.resources.xml-path=classpath:campus-resources.xml
